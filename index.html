<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>স্বদেশী এগ্রো</title>
<meta name="theme-color" content="#1f5c3a">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Bengali:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#f3f6f2;--card:#fff;--ink:#1c2b21;--mute:#6a786e;--line:#e2e9e3;--ac:#2e7d4f;--ac2:#e6f2ea;--yolk:#d98a12;--yolk2:#fdf2e0;--bad:#c0392b;--bad2:#fbe9e7;--r:16px;color-scheme:light}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Noto Sans Bengali",system-ui,sans-serif;font-size:15px;line-height:1.7;padding-bottom:calc(150px + env(safe-area-inset-bottom,0px))}
header{background:linear-gradient(135deg,#1f5c3a,#2e7d4f);color:#fff;padding:calc(14px + env(safe-area-inset-top,0px)) 16px 18px;border-radius:0 0 24px 24px}
.top{display:flex;align-items:center;gap:12px}
.logo{width:46px;height:46px;border-radius:50%;background:#fff;flex-shrink:0}
.top b{font-size:20px;display:block;line-height:1.2}.top span{font-size:12px;opacity:.85}
main{padding:12px 14px;max-width:620px;margin:0 auto}
h2{font-size:16px;margin:18px 4px 8px;display:flex;justify-content:space-between;align-items:center;gap:8px}
h2 small{font-size:12px;color:var(--mute);font-weight:500}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.kpi{background:var(--card);border-radius:var(--r);padding:12px 14px;border-left:5px solid var(--ac)}
.kpi span{font-size:12px;color:var(--mute);display:block}
.kpi b{font-size:21px;display:block;line-height:1.3}
.kpi.y{border-left-color:var(--yolk)}.kpi.r{border-left-color:var(--bad)}
.card{background:var(--card);border-radius:var(--r);padding:13px;margin-bottom:10px}
.row{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:9px 0;border-bottom:1px solid var(--line)}
.row:last-child{border:0}
.row small{display:block;color:var(--mute);font-size:12px}
.pill{font-size:12px;padding:2px 9px;border-radius:99px;background:var(--ac2);color:var(--ac);white-space:nowrap;font-weight:600}
.pill.y{background:var(--yolk2);color:var(--yolk)}.pill.r{background:var(--bad2);color:var(--bad)}
.ok{color:var(--ac);font-weight:700}.bad{color:var(--bad);font-weight:700}
.alert{display:flex;gap:10px;align-items:flex-start;background:var(--yolk2);border-radius:12px;padding:10px 12px;margin-bottom:8px}
.alert.r{background:var(--bad2)}.alert i{font-style:normal;font-size:18px}
.alert b{font-size:14px}.alert small{display:block;color:var(--mute);font-size:12px}
.bar{height:8px;background:var(--line);border-radius:6px;overflow:hidden;margin:6px 0}
.bar i{display:block;height:100%;background:var(--ac)}
.chart{display:flex;align-items:flex-end;gap:6px;height:110px}
.chart div{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;height:100%;font-size:11px;color:var(--mute)}
.chart i{width:100%;background:linear-gradient(#f0b04a,#d98a12);border-radius:8px 8px 3px 3px;min-height:4px}
.chart div.t i{background:linear-gradient(#4ea86b,#2e7d4f)}
label{display:block;font-size:13px;color:var(--mute);margin:8px 0 2px}
input,select,textarea{width:100%;font:inherit;color:var(--ink);background:#f7f9f7;border:1px solid var(--line);border-radius:10px;padding:9px}
textarea{min-height:90px}
.two{display:grid;grid-template-columns:1fr 1fr;gap:8px}
button{font:inherit;font-weight:600;border:0;border-radius:12px;padding:11px 12px;background:var(--ac);color:#fff;width:100%;margin-top:10px}
button.g{background:var(--ac2);color:var(--ac)}
button.o{background:var(--yolk2);color:var(--yolk)}
button.d{background:var(--bad2);color:var(--bad);width:auto;padding:6px 12px;margin:0;font-size:13px}
button.s{background:var(--ac2);color:var(--ac);width:auto;padding:6px 12px;margin:0;font-size:13px}
.act{display:flex;gap:6px;flex-shrink:0;align-items:center}
.empty{color:var(--mute);text-align:center;padding:14px}
.note{font-size:12px;color:var(--mute);margin:6px 2px}
.btns{display:grid;grid-template-columns:1fr 1fr;gap:8px}
nav{position:fixed;left:0;right:0;bottom:0;background:#fff;box-shadow:0 -2px 12px rgba(0,0,0,.08);display:grid;grid-template-columns:repeat(6,1fr);padding-bottom:env(safe-area-inset-bottom,0px);z-index:10}
nav button{background:none;color:var(--mute);margin:0;padding:6px 2px;font-size:11px;font-weight:500;line-height:1.25;border-radius:0}
nav button i{display:block;font-style:normal;font-size:19px;line-height:1.3}
nav button.on{color:var(--ac);font-weight:700;background:var(--ac2)}
#toast{position:fixed;left:12px;right:12px;bottom:calc(150px + env(safe-area-inset-bottom,0px));background:#111;color:#fff;padding:10px 14px;border-radius:10px;z-index:60;display:none;text-align:center}
</style>
</head>
<body>
<header>
  <div class="top">
    <img class="logo" src="logo-256.png" alt="" onerror="this.style.display='none'">
    <div><b>স্বদেশী এগ্রো</b><span id="dt"></span></div>
  </div>
</header>
<main id="app"></main>
<nav id="nav"></nav>
<div id="toast"></div>
<script>
var KEY="khamar_v3",TAB="home";
var TABS=[["home","🏠","হোম"],["parent","🐓","প্যারেন্টস"],["meat","🍗","মাংসের মুরগি"],["chick","🐥","বাচ্চা"],["egg","🥚","ডিম"],["inc","🔌","ইনকিউবেটর"],["feed","🌾","খাবার"],["med","💊","ওষুধ"],["money","💰","হিসাব"],["assets","🧺","এসেট"],["rate","📈","রেট"],["loan","🤝","ধার"]];
var DB={flock:[],eggs:[],eggOwn:[],esale:[],inc:[],chk:[],med:[],feed:[],led:[],wt:[],cfg:[],loan:[]};
try{var sv=localStorage.getItem(KEY);if(sv)Object.assign(DB,JSON.parse(sv))}catch(e){}
DB.inc.forEach(function(b){b.cands=b.cands||[]});

/* ---------- helpers ---------- */
function save(){try{localStorage.setItem(KEY,JSON.stringify(DB))}catch(e){}}
function iso(d){var m=d.getMonth()+1,x=d.getDate();return d.getFullYear()+"-"+(m<10?"0":"")+m+"-"+(x<10?"0":"")+x}
function today(){return iso(new Date())}
function dt(s){var p=s.split("-");return new Date(+p[0],+p[1]-1,+p[2])}
function diff(a,b){return Math.round((dt(a)-dt(b))/864e5)}
function addD(s,n){var d=dt(s);d.setDate(d.getDate()+n);return iso(d)}
function bn(n){return Number(n||0).toLocaleString("bn-BD",{maximumFractionDigits:1})}
function tk(n){return "৳"+bn(Math.round(n||0))}
function fmt(s){return dt(s).toLocaleDateString("bn-BD",{day:"numeric",month:"short",year:"numeric"})}
function sum(a,f){return a.reduce(function(t,x){return t+(+f(x)||0)},0)}
function id(){return String(Date.now()+Math.random())}
function esc(t){return String(t==null?"":t).replace(/[&<>"]/g,function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]})}
function V(i){var e=document.getElementById(i);return e?e.value:""}
function N(i){return +V(i)||0}
function msg(t){var e=document.getElementById("toast");e.textContent=t;e.style.display="block";clearTimeout(window.tt);window.tt=setTimeout(function(){e.style.display="none"},2500)}
function add(k,o){o.id=id();DB[k].push(o);save();render()}
function del(k,i){DB[k]=DB[k].filter(function(x){return String(x.id)!==String(i)});save();render()}
function one(k,i){return DB[k].filter(function(x){return String(x.id)===String(i)})[0]}
function F(l,i,t,ph,d){return "<label>"+l+"</label><input id='"+i+"' type='"+(t||"number")+"' placeholder='"+esc(ph||"")+"' value='"+(d==null?"":d)+"'"+(t==="number"?" inputmode='decimal'":"")+">"}
function S(l,i,o){return "<label>"+l+"</label><select id='"+i+"'>"+o.map(function(x){return "<option value='"+x[0]+"'>"+x[1]+"</option>"}).join("")+"</select>"}
function kpi(c,v,l){return "<div class='kpi "+c+"'><span>"+l+"</span><b>"+v+"</b></div>"}
function alertB(c,ic,t,s){return "<div class='alert "+c+"'><i>"+ic+"</i><div><b>"+t+"</b>"+(s?"<small>"+s+"</small>":"")+"</div></div>"}

/* ---------- রেট ---------- */
function rateAt(d){var rs=DB.cfg.filter(function(c){return c.type==="rate"&&c.date<=d}).sort(function(a,b){return a.date<b.date?-1:1}),r=rs[rs.length-1]||{};
 return{egg:r.egg||18,chick:r.chick||60,kg:r.kg||580,m1:r.m1||120,m2:r.m2||220,m3:r.m3||300}}
function curRate(){return rateAt(today())}

/* ---------- ব্যাচ ও ডিম ---------- */
function bHatch(b){return addD(b.start,b.days||21)}
function cDead(bid){return sum(DB.chk.filter(function(x){return x.kind==="die"&&String(x.bid)===String(bid)}),function(x){return x.n})}
function cSold(bid){return sum(DB.chk.filter(function(x){return x.kind==="sell"&&String(x.bid)===String(bid)}),function(x){return x.n})}
function cCost(bid){return sum(DB.led.filter(function(x){return x.type==="out"&&x.grp==="chick"&&String(x.bid)===String(bid)}),function(x){return x.amt})}
function meatAlive(b){return Math.max(0,(b.hatched||0)-cDead(b.id)-cSold(b.id))}
function seedStock(){return sum(DB.eggs,function(x){return x.seed})-sum(DB.inc,function(x){return x.count})-sum(DB.eggs,function(x){return x.seedBad})-sum(DB.eggOwn.filter(function(x){return x.src==="seed"}),function(x){return x.n})}
function tableStock(){return sum(DB.eggs,function(x){return x.table})-sum(DB.esale,function(x){return x.n})-sum(DB.eggOwn.filter(function(x){return x.src==="table"}),function(x){return x.n})}
function goodEggs(b){return b.count-sum(b.cands,function(c){return (c.clear||0)+(c.rot||0)+(c.broken||0)})}
function eggsOn(d){return sum(DB.eggs.filter(function(x){return x.date===d}),function(x){return x.table+x.seed})}
function parents(){return sum(DB.flock,function(x){return x.n})}
function parentVal(){return sum(DB.flock,function(x){return x.n*x.price})}
function assetTotal(){return sum(DB.led.filter(function(x){return x.type==="asset"}),function(x){return x.amt})}

/* ---------- খাবার ---------- */
function autoUsed(){var t=today();return sum(DB.cfg.filter(function(c){return c.type==="auto"}),function(c){var end=c.to&&c.to<t?c.to:t,d=diff(end,c.from)+1;return d>0?d*c.kg:0})}
function feedBought(){return sum(DB.feed.filter(function(x){return x.kind==="buy"}),function(x){return x.kg})}
function feedUsedManual(){return sum(DB.feed.filter(function(x){return x.kind==="use"}),function(x){return x.kg})}
function feedLeft(){return feedBought()-autoUsed()-feedUsedManual()}
function feedPrice(){var b=DB.feed.filter(function(x){return x.kind==="buy"&&x.price});var k=sum(b,function(x){return x.kg});return k?sum(b,function(x){return x.kg*x.price})/k:50}
function autoKg(){var a=DB.cfg.filter(function(c){return c.type==="auto"&&!c.to}).pop();return a?a.kg:0}
function daysLeft(){var k=autoKg();return k?Math.floor(feedLeft()/k):0}

/* ---------- হোম ---------- */
function home(){
 var t=today(),al="";
 DB.med.filter(function(x){return !x.done&&diff(x.date,t)<=0}).forEach(function(m){var d=diff(m.date,t);al+=alertB(d<0?"r":"","💊",esc(m.name),d<0?bn(-d)+" দিন দেরি":"আজ দিতে হবে")});
 DB.inc.forEach(function(b){if(b.hatched!=null)return;var d=diff(t,b.start);
  if(d===0)al+=alertB("","🌡️",esc(b.name)+": নতুন ব্যাচ","তাপমাত্রা 37.7° · আর্দ্রতা 60%");
  if(!b.cands.length&&d>=5&&d<18)al+=alertB("","🔦",esc(b.name)+": ক্যান্ডলিং করুন","বাওয়া, নষ্ট ও ভাঙা ডিম গুনুন");
  if(!b.tr&&d>=18)al+=alertB("r","🐣",esc(b.name)+": ডিম ট্রেতে উঠান","আর্দ্রতা 70% করুন");
  if(b.tr&&d>=(b.days||21))al+=alertB("r","🐥",esc(b.name)+": বাচ্চা ফোটার সময়","ফুটলে সংখ্যা লিখুন");
 });
 if(daysLeft()<=5)al+=alertB("","🌾","খাবার প্রায় শেষ","প্রায় "+bn(daysLeft())+" দিন চলবে");
 if(!DB.eggs.some(function(x){return x.date===t}))al+=alertB("","🥚","আজকের ডিম এখনো লেখা হয়নি","ডিম ট্যাবে লিখুন");
 var last=[];for(var i=6;i>=0;i--)last.push(eggsOn(addD(t,-i)));var mx=Math.max.apply(null,last.concat([1]));
 var chart="<div class='card'><div class='chart'>"+last.map(function(v,i){return "<div class='"+(i===6?"t":"")+"'><i style='height:"+Math.max(6,v/mx*100)+"%'></i>"+bn(v)+"</div>"}).join("")+"</div></div>";
 var inc=sum(DB.esale,function(x){return x.n*x.price})+sum(DB.led.filter(function(x){return x.type==="in"}),function(x){return x.amt});
 var out=sum(DB.feed.filter(function(x){return x.kind==="buy"}),function(x){return x.kg*x.price})+sum(DB.med.filter(function(x){return x.done}),function(x){return x.cost})+sum(DB.led.filter(function(x){return x.type==="out"||x.type==="loss"}),function(x){return x.amt});
 var net=inc-out;
 return "<h2>আজকের অবস্থা</h2><div class='grid'>"+
  kpi("",bn(eggsOn(t))+"টি","আজকের ডিম")+kpi("",bn(sum(DB.inc,meatAlive))+"টি","মাংসের মুরগি")+kpi("",bn(parents())+"টি","প্যারেন্ট")+kpi(daysLeft()<=5?"r":"y",bn(feedLeft())+" কেজি","খাবার বাকি · "+bn(daysLeft())+" দিন")+"</div>"+
  "<h2>করণীয় ও সাজেশন</h2>"+(al||"<div class='empty'>আজ জরুরি কিছু নেই ✓</div>")+
  "<h2>গত ৭ দিনের ডিম</h2>"+chart+
  "<h2>আর্থিক সার</h2><div class='grid'>"+kpi("",tk(parentVal()),"প্যারেন্টসের মূল্য")+kpi("y",tk(assetTotal()),"মোট এসেট")+kpi(net>=0?"":"r",tk(Math.abs(net)),net>=0?"মোট লাভ":"মোট লস")+kpi("y",tk(tableStock()*curRate().egg),"ডিমের বাজার মূল্য")+"</div>"+
  "<h2>ব্যাকআপ</h2><div class='card'><div class='note'>ডাটা এই ফোনে থাকে। নিয়মিত কপি করে রাখুন।</div>"+
  "<textarea id='bk' placeholder='ব্যাকআপ টেক্সট এখানে পেস্ট করে ইমপোর্ট করুন'></textarea><div class='btns'>"+
  "<button class='g' onclick='exportBk()'>কপি করুন</button><button onclick='importBk()'>ইমপোর্ট করুন</button></div></div>";
}
function exportBk(){var j=JSON.stringify(DB);document.getElementById("bk").value=j;try{navigator.clipboard.writeText(j).then(function(){msg("কপি হয়েছে")},function(){msg("বক্স থেকে কপি করুন")})}catch(e){msg("বক্স থেকে কপি করুন")}}
function importBk(){try{var o=JSON.parse(V("bk"));Object.keys(DB).forEach(function(k){if(Array.isArray(o[k]))DB[k]=o[k]});DB.inc.forEach(function(b){b.cands=b.cands||[]});save();render();msg("ইমপোর্ট হয়েছে")}catch(e){msg("ব্যাকআপ ঠিক নেই")}}

/* ---------- প্যারেন্টস ও ওজন ---------- */
function parentV(){
 var g=DB.flock.filter(function(x){return x.n>0});
 var h="<h2>প্যারেন্টস <small>মোট "+bn(parents())+"টি</small></h2><div class='grid'>"+kpi("",bn(sum(g.filter(function(x){return x.type==="মুরগি"}),function(x){return x.n}))+"টি","মুরগি")+kpi("",bn(sum(g.filter(function(x){return x.type==="মোরগ"}),function(x){return x.n}))+"টি","মোরগ")+"</div>";
 h+="<div class='card'>"+(g.map(function(x){return "<div class='row'><div>"+esc(x.type)+" · "+bn(x.n)+"টি<small>প্রতি "+tk(x.price)+" · মোট "+tk(x.n*x.price)+(x.age!=null?" · বয়স "+bn(x.age)+" মাস":"")+(x.dead?" · মৃত "+bn(x.dead):"")+"</small></div><div class='act'><button class='d' onclick=\"del('flock','"+x.id+"')\">মুছুন</button></div></div>"}).join("")||"<div class='empty'>কোনো প্যারেন্ট নেই</div>")+"</div>";
 h+="<h2>নতুন প্যারেন্ট যোগ</h2><div class='card'>"+S("ধরন","pt",[["মুরগি","মুরগি"],["মোরগ","মোরগ"]])+"<div class='two'><div>"+F("সংখ্যা","pn","number","")+"</div><div>"+F("বয়স (মাস)","pa","number","")+"</div></div>"+F("প্রতিটির দাম (৳)","pprice","number","")+"<button onclick='addParent()'>যোগ করুন</button></div>";
 h+="<h2>বিক্রি বা মারা গেছে</h2><div class='card'>"+S("কোন গ্রুপ","pg",g.map(function(x){return [x.id,x.type+" ("+bn(x.n)+"টি)"]}))+S("কী হলো","pk",[["sell","বিক্রি"],["dead","মারা গেছে"]])+"<div class='two'><div>"+F("সংখ্যা","pq","number","")+"</div><div>"+F("বিক্রির দাম/টি (৳)","pp","number","")+"</div></div>"+F("তারিখ","pd","date","",today())+"<button class='o' onclick='pAct()'>সংরক্ষণ করুন</button></div>";
 h+="<h2>ওজন এন্ট্রি</h2><div class='card'>"+F("তারিখ","wd","date","",today())+"<div class='two'><div>"+F("কয়টি মাপলেন","wn","number","")+"</div><div>"+F("মোট ওজন (কেজি)","wk","number","")+"</div></div><button class='g' onclick='addW()'>সংরক্ষণ</button></div>";
 h+="<div class='card'>"+DB.wt.slice().reverse().slice(0,20).map(function(x){return "<div class='row'><div>"+fmt(x.date)+"<small>"+bn(x.n)+"টি · মোট "+bn(x.kg)+" কেজি</small></div><button class='d' onclick=\"del('wt','"+x.id+"')\">মুছুন</button></div>"}).join("")+"</div>";
 return h;
}
function addParent(){var n=N("pn"),p=N("pprice");if(!n)return msg("সংখ্যা দিন");add("flock",{type:V("pt"),n:n,n0:n,age:N("pa")||null,price:p,dead:0,asOf:today()})}
function pAct(){var g=one("flock",V("pg")),q=N("pq"),k=V("pk");if(!g||!q)return msg("গ্রুপ ও সংখ্যা দিন");q=Math.min(q,g.n);g.n-=q;
 if(k==="dead"){g.dead=(g.dead||0)+q;DB.led.push({id:id(),date:V("pd"),type:"loss",cat:"মুরগি মারা যাওয়ার ক্ষতি",amt:q*g.price})}
 else{DB.led.push({id:id(),date:V("pd"),type:"in",cat:"মুরগি বিক্রি",amt:q*(N("pp")||g.price)})}
 save();render();msg("সংরক্ষণ হয়েছে")}
function addW(){var k=N("wk");if(!k)return msg("মোট ওজন দিন");add("wt",{date:V("wd"),n:N("wn"),kg:k})}

/* ---------- মাংসের মুরগি ---------- */
function meatV(){
 var t=today(),tot=0,h="";
 DB.inc.forEach(function(b){if(b.hatched==null)return;var alive=meatAlive(b);if(!alive)return;

 var exp=feedC+medC+out+loss,invest=parentVal()+assetTotal()+feedC;
 var all=sum(DB.esale,function(x){return x.n*x.price})+sum(DB.led.filter(function(x){return x.type==="in"}),function(x){return x.amt});
 var allOut=sum(DB.feed.filter(function(x){return x.kind==="buy"}),function(x){return x.kg*x.price})+sum(DB.med.filter(function(x){return x.done}),function(x){return x.cost})+sum(DB.led.filter(function(x){return x.type==="out"||x.type==="loss"}),function(x){return x.amt});
 var net=all-allOut;
 return "<h2>মোট হিসাব</h2><div class='grid'>"+kpi("",tk(invest),"মোট ইনভেস্ট")+kpi("y",tk(assetTotal()),"এসেট")+kpi(net>=0?"":"r",tk(Math.abs(net)),net>=0?"মোট লাভ":"মোট লস")+kpi("",tk(parentVal()),"প্যারেন্ট মূল্য")+"</div>"+
 "<h2>এই মাসের হিসাব <small>"+m+"</small></h2><div class='card'><div class='row'><div>মোট আয়</div><b class='ok'>"+tk(inc)+"</b></div><div class='row'><div>মোট খরচ ও ক্ষতি</div><b class='bad'>"+tk(exp)+"</b></div><div class='row'><div>এই মাসের লাভ/লস</div><b>"+tk(inc-exp)+"</b></div></div>"+
 "<h2>খরচের বিবরণ</h2><div class='card'><div class='row'><div>খাবার ক্রয়</div><b>"+tk(feedC)+"</b></div><div class='row'><div>ওষুধ/ভ্যাক্সিন</div><b>"+tk(medC)+"</b></div><div class='row'><div>অন্যান্য খরচ</div><b>"+tk(out)+"</b></div><div class='row'><div>মারা যাওয়ার ক্ষতি</div><b>"+tk(loss)+"</b></div></div>"+
 "<h2>ডিমের হিসাব</h2><div class='card'><div class='row'><div>ডিম উৎপাদন মূল্য<small>মোট ডিম × ডিমের রেট</small></div><b>"+tk((tableStock()+sum(DB.eggs,function(x){return x.seed}))*curRate().egg)+"</b></div></div>";
}

/* ---------- এসেট ---------- */
function assetsV(){
 var l=DB.led.filter(function(x){return x.type==="asset"});
 return "<h2>এসেট <small>এককালীন ভালো আছে এমন জিনিস</small></h2><div class='card'>"+(l.map(function(x){return "<div class='row'><div>"+esc(x.cat)+"<small>"+fmt(x.date)+"</small></div><div class='act'><b>"+tk(x.amt)+"</b><button class='d' onclick=\"del('led','"+x.id+"')\">মুছুন</button></div></div>"}).join("")||"<div class='empty'>কোনো এসেট নেই</div>")+"<div class='row'><b>মোট এসেট</b><b>"+tk(assetTotal())+"</b></div></div>"+
 "<h2>নতুন এসেট</h2><div class='card'>"+F("জিনিসের নাম","an","text","যেমন: ব্রুডিং টিন")+"<div class='two'><div>"+F("দাম (৳)","aa","number","")+"</div><div>"+F("তারিখ","ad","date","",today())+"</div></div><button onclick='addAsset()'>যোগ করুন</button></div>";
}
function addAsset(){if(!V("an"))return msg("নাম দিন");DB.led.push({id:id(),date:V("ad"),type:"asset",cat:V("an"),amt:N("aa")});save();render();msg("যোগ হয়েছে")}

/* ---------- রেট ---------- */
function rateV(){
 var r=curRate();
 return "<h2>এখনকার রেট</h2><div class='grid'>"+kpi("y",tk(r.egg),"ডিমের রেট")+kpi("",tk(r.chick),"০ বাচ্চা")+kpi("",tk(r.kg),"মোরগ-মুরগি (কেজি)")+kpi("",tk(r.m1),"১ মাসের বাচ্চা")+kpi("",tk(r.m2),"২ মাসের বাচ্চা")+kpi("",tk(r.m3),"৩ মাসের বাচ্চা")+"</div>"+
 "<h2>নতুন রেট বসান</h2><div class='card'>"+F("কোন তারিখ থেকে","rd","date","",today())+"<div class='two'><div>"+F("ডিম (৳)","re","number","",r.egg)+"</div><div>"+F("০ বাচ্চা (৳)","rc","number","",r.chick)+"</div></div><div class='two'><div>"+F("মোরগ-মুরগি কেজি (৳)","rk","number","",r.kg)+"</div><div>"+F("১ মাস (৳)","r1","number","",r.m1)+"</div></div><div class='two'><div>"+F("২ মাস (৳)","r2","number","",r.m2)+"</div><div>"+F("৩ মাস (৳)","r3","number","",r.m3)+"</div></div><button onclick='saveRate()'>রেট সংরক্ষণ করুন</button><div class='note'>রেট বদলালে বাজার মূল্য ও এসেট নিজে বদলে যায়।</div></div>";
}
function saveRate(){add("cfg",{type:"rate",date:V("rd"),egg:N("re"),chick:N("rc"),kg:N("rk"),m1:N("r1"),m2:N("r2"),m3:N("r3")});msg("রেট সংরক্ষিত")}

/* ---------- ধার ---------- */
function loanV(){
 var g=DB.loan.filter(function(x){return x.dir==="give"&&!x.done}),t=DB.loan.filter(function(x){return x.dir==="get"&&!x.done});
 var row=function(x){return "<div class='row'><div>"+esc(x.who)+"<small>"+fmt(x.date)+(x.note?" · "+esc(x.note):"")+"</small></div><div class='act'><b>"+tk(x.amt)+"</b>"+(x.done?"":"<button class='s' onclick=\"loanDone('"+x.id+"')\">ফেরত</button>")+"<button class='d' onclick=\"del('loan','"+x.id+"')\">মুছুন</button></div></div>"};
 return "<h2>ধারের হিসাব</h2><div class='grid'>"+kpi("y",tk(sum(t,function(x){return x.amt})),"আমি পাবো")+kpi("r",tk(sum(g,function(x){return x.amt})),"আমি দেবো")+"</div>"+
 "<h2>আমি পাবো</h2><div class='card'>"+(t.map(row).join("")||"<div class='empty'>কিছু নেই</div>")+"</div>"+
 "<h2>আমি দেবো</h2><div class='card'>"+(g.map(row).join("")||"<div class='empty'>কিছু নেই</div>")+"</div>"+
 "<h2>নতুন ধার</h2><div class='card'>"+S("ধরন","lt",[["get","ধার দিলাম (আমি পাবো)"],["give","ধার নিলাম (আমি দেবো)"]])+F("কার কাছ থেকে / কাকে","lw","text","")+F("টাকা (৳)","la","number","")+F("তারিখ","ld","date","",today())+F("নোট","ln","text","")+"<button onclick='addLoan()'>যোগ করুন</button></div>";
}
function addLoan(){var a=N("la");if(!a||!V("lw"))return msg("নাম ও টাকা দিন");add("loan",{dir:V("lt"),who:V("lw"),amt:a,date:V("ld"),note:V("ln"),done:false})}
function loanDone(i){var x=one("loan",i);if(x){x.done=true;save();render();msg("ফেরত হিসাবে রাখা হলো")}}

/* ---------- রেন্ডার ---------- */
var VIEW={home:home,parent:parentV,meat:meatV,chick:chickV,egg:eggV,inc:incV,feed:feedV,med:medV,money:moneyV,assets:assetsV,rate:rateV,loan:loanV};
function go(t){TAB=t;render();window.scrollTo(0,0)}
function render(){
 document.getElementById("dt").textContent=dt(today()).toLocaleDateString("bn-BD",{weekday:"long",day:"numeric",month:"long",year:"numeric"});
 document.getElementById("nav").innerHTML=TABS.map(function(x){return "<button class='"+(x[0]===TAB?"on":"")+"' onclick=\"go('"+x[0]+"')\"><i>"+x[1]+"</i>"+x[2]+"</button>"}).join("");
 document.getElementById("app").innerHTML=VIEW[TAB]();
}
render();
</script>
</body>
</html>
