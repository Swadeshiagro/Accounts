<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>স্বদেশী এগ্রো</title>
<link href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#0d2f7d;--card:#fff;--inp:#f2f6fd;--ink:#14213d;--mute:#5a6785;--line:#dbe3f3;--ac:#17802a;--acx:#fff;--yolk:#e39a0b;--red:#c62828;--onbg:#fff;--sub:#ffd27a;color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#081c4d;--card:#13264f;--inp:#0d1b3d;--ink:#e8eefc;--mute:#9fb0d6;--line:#2a3d70;--ac:#3fae52;--acx:#06210c;--yolk:#f0b83a;--red:#ff8a80;color-scheme:dark}}
*{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 "Hind Siliguri",system-ui,sans-serif;padding-bottom:84px}
main{max-width:560px;margin:0 auto;padding:14px}
h1{font-size:21px;margin:4px 0 12px;color:var(--onbg)}
h2{font-size:17px;margin:20px 0 8px;color:var(--sub)}
.hd{display:flex;align-items:center;gap:12px;color:var(--onbg);padding-bottom:10px;margin-bottom:14px;border-bottom:3px solid var(--ac)}
.hd img{width:56px;height:56px;border-radius:50%;flex-shrink:0;background:#fff}
.hd b{display:block;font-size:23px;line-height:1.2}.hd span{font-size:13px;color:var(--sub);letter-spacing:.3px}
.sum{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:8px}
.sum div{background:var(--card);border-radius:10px;padding:9px 12px;border-left:5px solid var(--ac)}
.sum .y{border-left-color:var(--yolk)}.sum .r{border-left-color:var(--red)}.sum .w{grid-column:1/3}
.sum b{display:block;font-size:22px;line-height:1.3}
.sum span{color:var(--mute);font-size:13px;display:block;line-height:1.35}
.box{background:var(--card);border-radius:10px;padding:12px;margin-bottom:10px}
.box.warn{border-left:5px solid var(--red)}
label{display:block;font-size:13px;color:var(--mute);margin:8px 0 2px}
input,select{width:100%;font:inherit;color:var(--ink);background:var(--inp);border:1px solid var(--line);border-radius:8px;padding:9px}
.row{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.row3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:6px}
button{font:inherit;font-weight:600;border:0;border-radius:8px;padding:10px 14px;background:var(--ac);color:var(--acx);width:100%;margin-top:12px}
button.s{width:auto;margin:3px 0 0 4px;padding:5px 10px;background:transparent;color:var(--red);border:1px solid var(--line);font-weight:500;font-size:14px}
button.s.p{color:var(--ac);border-color:var(--ac)}
button.g{background:transparent;color:var(--ac);border:1px solid var(--ac)}
button.o{background:var(--yolk);color:#1b1200}
.row3 button{margin:0;padding:9px 4px;font-size:14px;background:var(--yolk);color:#1b1200}
.it{display:flex;justify-content:space-between;align-items:flex-start;gap:8px;padding:9px 0;border-bottom:1px solid var(--line)}
.it:last-child{border:0}
.it small{color:var(--mute);display:block}
.act{text-align:right;flex-shrink:0}
.bad{color:var(--red);font-weight:600}.ok{color:var(--ac);font-weight:600}
.empty{color:var(--mute);text-align:center;padding:14px}
.bar{height:8px;background:var(--line);border-radius:4px;overflow:hidden;margin:3px 0 8px}.bar i{display:block;height:100%;background:var(--ac)}
nav{position:fixed;left:0;right:0;bottom:0;display:flex;overflow-x:auto;background:var(--ac);padding-bottom:env(safe-area-inset-bottom,0px)}
nav a{flex:1 0 auto;min-width:68px;text-align:center;padding:8px 6px;font-size:12px;line-height:1.3;color:#e6f4e8;font-weight:500}
nav a.on{color:#fff;font-weight:700;background:rgba(0,0,0,.18);box-shadow:inset 0 3px var(--yolk)}
.ov{position:fixed;inset:0;background:rgba(0,0,0,.55);display:flex;align-items:flex-end;justify-content:center;z-index:50;padding-bottom:env(safe-area-inset-bottom,0px)}
.sheet{background:var(--card);width:100%;max-width:560px;border-radius:16px 16px 0 0;padding:16px}
#toast{position:fixed;left:12px;right:12px;bottom:calc(76px + env(safe-area-inset-bottom,0px));background:#111;color:#fff;padding:10px 14px;border-radius:10px;z-index:60;display:none;text-align:center}
textarea{width:100%;font:inherit;color:var(--ink);background:var(--inp);border:1px solid var(--line);border-radius:8px;padding:9px;min-height:110px}
</style>
</head>
<body>
<main id="app"></main>
<nav id="nav"></nav>
<script>
var KEY="khamar_v3",tab="home",panel=null,SETTER=400,HATCHER=200,TDAY=18,CAND=5,TEMP=37.7,H1=60,H2=70,HPH=4;
function iso(d){var m=d.getMonth()+1,x=d.getDate();return d.getFullYear()+"-"+(m<10?"0":"")+m+"-"+(x<10?"0":"")+x}
function today(){return iso(new Date())}
function dt(s){var p=s.split("-");return new Date(+p[0],+p[1]-1,+p[2])}
function diff(a,b){return Math.round((dt(a)-dt(b))/864e5)}
function addD(s,n){var d=dt(s);d.setDate(d.getDate()+n);return iso(d)}
function fmt(s){return dt(s).toLocaleDateString("bn-BD",{day:"numeric",month:"short",year:"numeric"})}
function bn(n){return Number(n).toLocaleString("bn-BD",{maximumFractionDigits:1})}
function tk(n){return bn(Math.round(n))+" ৳"}
function esc(t){return String(t==null?"":t).replace(/[&<>"]/g,function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]})}
function sum(a,f){return a.reduce(function(t,x){return t+(+f(x)||0)},0)}
function id(){return Date.now()+Math.random()}
function v(i){return document.getElementById(i).value}
var D0=today();
function fresh(){return{eggs:[],esale:[],inc:[],chk:[],med:[],feed:[],led:[],wt:[],cfg:[],flock:[
{id:1,type:"মুরগি",n:5,n0:5,age:7,asOf:D0,price:700,dead:0},
{id:2,type:"মুরগি",n:18,n0:18,age:11,asOf:D0,price:650,dead:0},
{id:3,type:"মুরগি",n:16,n0:16,age:5,asOf:D0,price:500,dead:0},
{id:4,type:"মোরগ",n:12,n0:12,age:null,asOf:D0,price:500,dead:0}]}}
var db=fresh();
try{var sv=localStorage.getItem(KEY);if(sv)Object.assign(db,JSON.parse(sv));else{localStorage.removeItem("khamar_v1");localStorage.removeItem("khamar_v2")}}catch(e){}
function save(){try{localStorage.setItem(KEY,JSON.stringify(db))}catch(e){}if(R){if(ready)push();else toast("ডাটা এখনো লোড হয়নি, এই লেখা সংরক্ষণ হয়নি। একটু পরে আবার চেষ্টা করুন।")}autoBk()}
function put(k,o){db[k].push(o);save();draw()}
var tt;function toast(m){var e=document.getElementById("toast");if(!e){e=document.createElement("div");e.id="toast";document.body.appendChild(e)}e.textContent=m;e.style.display="block";clearTimeout(tt);tt=setTimeout(function(){e.style.display="none"},3500)}
window.alert=function(m){toast(m)};
var MD=null;
function ask(t,f,cb,ok){MD={t:t,f:f||[],cb:cb,ok:ok||"ঠিক আছে"};dm()}
function dm(){var m=document.getElementById("modal");if(!m){m=document.createElement("div");m.id="modal";document.body.appendChild(m)}
 if(!MD){m.innerHTML="";return}
 m.innerHTML="<div class='ov'><div class='sheet'><b>"+MD.t+"</b>"+MD.f.map(function(f,i){return f.type==="area"?"<label>"+f.l+"</label><textarea id='mf"+i+"'>"+esc(f.d||"")+"</textarea>":f.type==="date"?F(f.l,"mf"+i,"date",f.d||today(),""):f.type==="text"?F(f.l,"mf"+i,"text","","autocomplete=off"):f.type==="pass"?F(f.l,"mf"+i,"password","","inputmode=numeric autocomplete=off"):F(f.l,"mf"+i,"number",f.d,"min=0 step=any inputmode=decimal")}).join("")+"<div class='row'><button class='g' onclick='mx()'>বাতিল</button><button onclick='mok()'>"+MD.ok+"</button></div></div></div>";
 var e=document.getElementById("mf0");if(e&&e.tagName==="INPUT")e.focus()}
function mx(){MD=null;dm()}
function mok(){var m=MD,a=m.f.map(function(f,i){return document.getElementById("mf"+i).value});MD=null;dm();m.cb(a)}
var PW="123456";
function del(k,i){ask("মুছতে পাসওয়ার্ড দিন",[{l:"পাসওয়ার্ড",type:"pass"}],function(a){if(a[0]!==PW)return alert("পাসওয়ার্ড ভুল হয়েছে, কিছু মোছা হয়নি");db[k]=db[k].filter(function(x){return x.id!==i});save();draw();alert("মুছে গেছে")},"মুছুন")}
function go(t){tab=t;panel=null;draw();window.scrollTo(0,0)}
function F(l,i,t,d,x){return "<label>"+l+"</label><input id='"+i+"' type='"+t+"' value='"+(d==null?"":d)+"' "+(x||"")+">"}
function S(l,i,o){return "<label>"+l+"</label><select id='"+i+"'>"+o.map(function(z){return "<option>"+z+"</option>"}).join("")+"</select>"}
var NUM="min=0 inputmode=decimal",INT="min=0 inputmode=numeric";

/* ---------- হিসাব ---------- */
function cd(x){var c={clear:0,rot:0,broken:0};(x.cands||[]).forEach(function(k){c.clear+=k.clear||0;c.rot+=k.rot||0;c.broken+=k.broken||0});return c}
function mig(){db.inc.forEach(function(x){if(!x.cands){x.cands=x.cand?[x.cand]:[];delete x.cand}})}
function live(x){var c=cd(x);return x.count-c.clear-c.rot-c.broken}
function seedTotal(){return sum(db.eggs,function(x){return x.seed})}
function seedStock(){return sum(db.eggs,function(x){return x.seed-(x.seedBad||0)})-sum(db.inc,function(x){return x.count})}
function tableStock(){return sum(db.eggs,function(x){return x.table})+sum(db.inc,function(x){return cd(x).clear})-sum(db.esale,function(x){return x.n+(x.bad||0)})}
function chickStock(){return sum(db.inc,function(x){return x.hatched||0})-sum(db.chk,function(x){return x.n})}
function oldestSeed(){var r=seedStock();if(r<=0)return null;var a=db.eggs.slice().sort(function(x,y){return x.date<y.date?1:-1}),acc=0;for(var i=0;i<a.length;i++){acc+=a[i].seed-(a[i].seedBad||0);if(acc>=r)return a[i].date}return null}
function setterUsed(){return sum(db.inc.filter(function(x){return x.hatched==null&&x.tr==null}),live)}
function hatcherUsed(){return sum(db.inc.filter(function(x){return x.hatched==null&&x.tr!=null}),function(x){return x.tr})}
function hatchRate(){var d=db.inc.filter(function(x){return x.hatched!=null&&x.count});return d.length?sum(d,function(x){return x.hatched})/sum(d,function(x){return x.count})*100:null}
function seedPerDay(){var t=today();return sum(db.eggs.filter(function(x){return diff(t,x.date)>=0&&diff(t,x.date)<7}),function(x){return x.seed})/7}
function feedLeft(){return sum(db.feed,function(x){return x.kind==="buy"||x.kind==="less"?x.kg:-x.kg})-autoUse()}
function autoRules(){return (db.cfg||[]).filter(function(x){return x.type==="autofeed"}).sort(function(a,b){return a.from<b.from?-1:1})}
function autoKg(){var kg=0,t=today();autoRules().forEach(function(r){if(r.from<=t)kg=r.kg});return kg}
function todayFrac(){var h=new Date().getHours();return h>=17?1:h>=8?0.5:0}
function autoUse(m){var R0=autoRules();if(!R0.length)return 0;var t=today(),tt=0;
 for(var d=R0[0].from;diff(t,d)>=0;d=addD(d,1)){if(m&&d.slice(0,7)!==m)continue;var kg=0;R0.forEach(function(r){if(r.from<=d)kg=r.kg});tt+=kg*(d===t?todayFrac():1)}return tt}
function manualUse(m){function ok(x){return !m||x.date.slice(0,7)===m}return sum(db.feed.filter(function(x){return x.kind==="use"&&ok(x)}),function(x){return x.kg})-sum(db.feed.filter(function(x){return x.kind==="less"&&ok(x)}),function(x){return x.kg})}
function seed2(){if((db.cfg||[]).some(function(x){return x.type==="flag"&&x.name==="m2"}))return;
 db.cfg=db.cfg||[];db.cfg.push({id:91000,type:"flag",name:"m2"},{id:91001,type:"autofeed",from:"2026-10-19",kg:3});
 if(!db.feed.some(function(x){return x.id===91002}))db.feed.push({id:91002,kind:"buy",kg:170,price:0,date:"2026-10-18",note:"রেগুলার খাবার তৈরি (নিজের বানানো)"});save()}
function feedAvgPrice(){var b=db.feed.filter(function(x){return x.kind==="buy"&&x.price>0}),k=sum(b,function(x){return x.kg});return k?sum(b,function(x){return x.kg*x.price})/k:0}
function feedPerDay(){var t=today(),w=db.feed.filter(function(x){return diff(t,x.date)>=0&&diff(t,x.date)<7});return autoKg()+(sum(w.filter(function(x){return x.kind==="use"}),function(x){return x.kg})-sum(w.filter(function(x){return x.kind==="less"}),function(x){return x.kg}))/7}
function birds(t){return sum(db.flock.filter(function(g){return !t||g.type===t}),function(g){return g.n})}
function ageNow(g){return g.age==null?null:g.age+Math.floor(diff(today(),g.asOf)/30.4)}
function parentsVal(){return sum(db.flock,function(g){return g.n*g.price})}
function parentsCost(){return sum(db.flock,function(g){return (g.n0||g.n)*g.price})}
function equipVal(){return sum(db.led.filter(function(x){return x.type==="asset"}),function(x){return x.amt})}
function avgEgg(){var s=db.esale.filter(function(x){return x.price>0}),n=sum(s,function(x){return x.n});return n?sum(s,function(x){return x.n*x.price})/n:0}
function avgChick(){var s=db.chk.filter(function(x){return x.kind==="sell"&&x.price>0}),n=sum(s,function(x){return x.n});return n?sum(s,function(x){return x.n*x.price})/n:0}
var EGGV=20;
function assetParts(){var b=chickBuckets(),rc=rt("chick")||avgChick();return{"মুরগি":parentVal().v,"সরঞ্জাম":equipVal(),"খাবার":Math.max(0,feedLeft())*feedAvgPrice(),"ডিম":(Math.max(0,seedStock())+Math.max(0,tableStock()))*rt("egg",20),"বাচ্চা ও বাড়ন্ত":b.chick*rc+b.m1*rt("m1")+b.m2*rt("m2")+b.m3*rt("m3")}}
function assets(){var p=assetParts();return Object.keys(p).reduce(function(t,k){return t+p[k]},0)}
function seed3(){if((db.cfg||[]).some(function(x){return x.type==="flag"&&x.name==="m3"}))return;
 db.cfg=db.cfg||[];db.cfg.push({id:91010,type:"flag",name:"m3"});
 db.feed.forEach(function(x){if(x.id===91002&&!x.price)x.price=50});
 if(!db.led.some(function(x){return x.id===91011}))db.led.push({id:91011,date:"2026-10-01",type:"asset",grp:"",cat:"ইনকিউবেটর/ঘর/সরঞ্জাম",amt:21000,note:"ইনকিউবেটর (৬০০ ডিমের অটো)"});save()}
function tot(o){return sum(Object.keys(o),function(k){return o[k]})}
var OT=["কারেন্ট বিল","তুষের বিল","এক্সট্রা খরচ"],FD=["সবজি","সবজি (খাবার)","অন্য খাবার"];
function fin(m){
 var i={},o={},od={},oo={},l={},ta=0,food=0,feedExp=0;function ok(d){return !m||d.slice(0,7)===m}function a(z,k,n){if(n)z[k]=(z[k]||0)+n}
 var ec=0,ev=0,cash=0;
 db.eggs.forEach(function(x){if(ok(x.date)&&!x.open){var q=(x.seed||0)+(x.table||0);ec+=q;ev+=q*rateAt("egg",x.date,20)}});
 if(ec)a(i,"ডিম উৎপাদন মূল্য ("+bn(ec)+"টি, গড় "+tk(ev/ec)+")",ev);
 db.esale.forEach(function(x){if(ok(x.date))cash+=x.n*(x.price||0)});
 var hb=db.inc.filter(function(x){return x.hatched!=null}),hh=sum(hb,function(x){return x.hatched}),ac=hh?sum(hb,function(x){return x.count*rateAt("egg",x.start,20)})/hh:0;
 db.chk.forEach(function(x){if(x.kind==="sell"&&ok(x.date))a(i,"বাচ্চা বিক্রি (ডিমের মূল্য বাদে)",x.n*((x.price||0)-ac))});
 var au=autoUse(m||null),mu=manualUse(m||null),fap=feedAvgPrice();
 if(au){var k1="রেগুলার খাবার — অটো ("+bn(au)+" কেজি)";a(o,k1,au*fap);a(od,k1,au*fap);food+=au*fap}
 if(mu){var k2="রেগুলার খাবার — নিজে এন্ট্রি ("+bn(mu)+" কেজি)";a(o,k2,mu*fap);a(od,k2,mu*fap);food+=mu*fap}
 feedExp=(au+mu)*fap;
 db.med.forEach(function(x){if(x.done&&ok(x.date)){var c=+x.cost||0;a(o,"ওষুধ/ভিটামিন",c);a(od,"ওষুধ/ভিটামিন",c)}});
 db.led.forEach(function(x){if(!ok(x.date))return;
  if(x.type==="in"){a(i,x.cat,x.amt);if(x.cost)a(l,"বিক্রিত মুরগির ক্রয়মূল্য",x.cost)}
  else if(x.type==="out"){var g=x.grp||(OT.indexOf(x.cat)>=0?"o":"d");a(o,x.cat,x.amt);a(g==="o"?oo:od,x.cat,x.amt);if(FD.indexOf(x.cat)>=0)food+=x.amt}
  else if(x.type==="loss")a(l,x.cat,x.amt);else if(x.type==="asset")ta+=x.amt});
 var r={i:i,o:o,od:od,oo:oo,l:l,ta:ta,food:food,feedExp:feedExp,cash:cash};r.ti=tot(i);r.to=tot(o);r.tl=tot(l);r.net=r.ti-r.to-r.tl;return r;
}
function invest(){var f=fin(null),fp=sum(db.feed.filter(function(x){return x.kind==="buy"}),function(x){return x.kg*(x.price||0)});return parentsCost()+equipVal()+(f.to-f.feedExp)+fp}

/* ---------- হোম ---------- */
function todayEggs(){var t=today(),a=db.eggs.filter(function(x){return x.date===t});return{s:sum(a,function(x){return x.seed}),t:sum(a,function(x){return x.table})}}
function home(){
 var t=today(),all=fin(null),mo=fin(t.slice(0,7)),net=all.net,al=[];
 db.inc.forEach(function(x){if(x.hatched!=null)return;var d=diff(t,x.start),nm=esc(x.name||"ব্যাচ");
  if(d===0)al.push("🌡️ "+nm+": নতুন ব্যাচ, তাপমাত্রা "+bn(TEMP)+"° ও আর্দ্রতা "+bn(H1)+"% সেট করুন");
  if(x.tr==null&&d===TDAY-1)al.push("⏰ "+nm+": আগামীকাল ১৮তম দিন, ডিম হ্যাচিং ট্রেতে উঠাবেন ও আর্দ্রতা "+bn(H2)+"% করবেন (তাপমাত্রা "+bn(TEMP)+"° ই)");
  if(x.tr==null&&d>=TDAY)al.push("🐣 "+nm+": ১৮ দিন পূর্ণ! এখনই ডিম হ্যাচিং ট্রেতে উঠান ও আর্দ্রতা "+bn(H2)+"% করুন");
  if(x.tr==null&&!(x.cands&&x.cands.length)&&d>=CAND&&d<TDAY)al.push("🔦 "+nm+": ক্যান্ডলিং করুন (বাওয়া, নষ্ট ও ভাঙা ডিম গুনুন)");
  if(x.tr!=null&&d>=x.days&&d<TDAY+HPH)al.push("🐥 "+nm+": বাচ্চা ফোটার সময়, আর্দ্রতা "+bn(H2)+"% থাকবে");
