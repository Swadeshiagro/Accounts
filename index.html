*{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.7 "Noto Sans Bengali","Noto Sans Bengali",system-ui,sans-serif;padding-bottom:calc(150px + env(safe-area-inset-bottom,0px))}

.hd{display:flex;align-items:center;gap:12px;color:#fff;background:linear-gradient(135deg,#25694a,#2e7d4f);padding:calc(14px + env(safe-area-inset-top,0px)) 16px 16px;border-radius:0 0 24px 24px;margin:-12px -14px 12px}

.sum{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:8px}
.sum div{background:var(--card);border-radius:var(--r);padding:12px 14px;border-left:5px solid var(--ac);box-shadow:0 1px 3px rgba(0,0,0,.08)}

.row{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.row3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:6px}
button{font:inherit;font-weight:600;border:0;border-radius:12px;padding:11px 12px;background:var(--ac);color:var(--acx);width:100%;margin-top:10px}

button.g{background:var(--ac2);color:var(--ac)}
button.o{background:var(--yolk2);color:var(--yolk)}
.row3 button{margin:0;padding:10px 4px;font-size:13px;background:var(--yolk2);color:var(--yolk)}
.it{display:flex;justify-content:space-between;align-items:flex-start;gap:8px;padding:9px 0;border-bottom:1px solid var(--line)}
.it:last-child{border:0}

.act{text-align:right;flex-shrink:0}
.bad{color:var(--red);font-weight:600}.ok{color:var(--ac);font-weight:600}

.bar{height:8px;background:var(--line);border-radius:6px;overflow:hidden;margin:4px 0 8px}.bar i{display:block;height:100%;background:var(--ac)}

<script>
var KEY="khamar_v3",tab="home",panel=null,SETTER=400,HATCHER=200,TDAY=18,CAND=5,TEMP=37.7,H1=60,H2=70,HPH=4,AGE1=21;
function iso(d){var m=d.getMonth()+1,x=d.getDate();return d.getFullYear()+"-"+(m<10?"0":"")+m+"-"+(x<10?"0":"")+x}
function today(){return iso(new Date())}
function dt(s){var p=s.split("-");return new Date(+p[0],+p[1]-1,+p[2])}
function diff(a,b){return Math.round((dt(a)-dt(b))/864e5)}
function addD(s,n){var d=dt(s);d.setDate(d.getDate()+n);return iso(d)}
function fmt(s){return dt(s).toLocaleDateString("bn-BD",{day:"numeric",month:"short",year:"numeric"})}
function bn(n){return Number(n).toLocaleString("bn-BD",{maximumFractionDigits:1})}
function tk(n){return bn(Math.round(n))+" ৳"}
function esc(t){return String(t==null?"":t).replace(/[&<>"]/g,function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]})}
function sum(a,f){return a.reduce(function(t,x){return t+(+f(x)||0)},0)}
function id(){return Date.now()+Math.random()}
function v(i){return document.getElementById(i).value}

try{var sv=localStorage.getItem(KEY);if(sv)Object.assign(db,JSON.parse(sv));else{localStorage.removeItem("khamar_v1");localStorage.removeItem("khamar_v2")}}catch(e){}
var BOOT=true;
