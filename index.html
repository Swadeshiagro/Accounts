<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>স্বদেশী এগ্রো · ডেমো</title>
<meta name="theme-color" content="#1f5c3a">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Bengali:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#f3f6f2;--card:#fff;--ink:#1c2b21;--mute:#6a786e;--line:#e2e9e3;--ac:#2e7d4f;--ac2:#e6f2ea;--yolk:#d98a12;--yolk2:#fdf2e0;--bad:#c0392b;--bad2:#fbe9e7;--blue:#2d6cb0;--radius:16px;color-scheme:light}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Noto Sans Bengali",system-ui,sans-serif;font-size:15px;line-height:1.75;padding-bottom:calc(84px + env(safe-area-inset-bottom,0px))}
header{background:linear-gradient(135deg,#1f5c3a,#2e7d4f);color:#fff;padding:calc(16px + env(safe-area-inset-top,0px)) 16px 22px;border-radius:0 0 26px 26px}
.top{display:flex;align-items:center;gap:12px}
.logo{width:48px;height:48px;border-radius:50%;background:#fff;object-fit:cover;flex-shrink:0}
.top b{font-size:20px;display:block;line-height:1.2}
.top span{font-size:12px;opacity:.85}
select{width:100%;margin-top:14px;font:inherit;color:var(--ink);background:#fff;border:0;border-radius:12px;padding:11px 12px;font-weight:600}
main{padding:14px;max-width:600px;margin:0 auto}
h2{font-size:16px;margin:20px 4px 8px;display:flex;justify-content:space-between;align-items:center}
h2 small{font-size:12px;color:var(--mute);font-weight:500}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.kpi{background:var(--card);border-radius:var(--radius);padding:12px 14px;box-shadow:0 1px 2px rgba(0,0,0,.04)}
.kpi span{font-size:12px;color:var(--mute);display:block}
.kpi b{font-size:22px;display:block;line-height:1.3}
.kpi.hi{background:var(--ac);color:#fff}.kpi.hi span{color:#d6ecde}
.kpi.warn b{color:var(--yolk)}
.card{background:var(--card);border-radius:var(--radius);padding:14px;margin-bottom:10px;box-shadow:0 1px 2px rgba(0,0,0,.04)}
.row{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:9px 0;border-bottom:1px solid var(--line)}
.row:last-child{border:0}
.row small{display:block;color:var(--mute);font-size:12px}
.pill{font-size:12px;padding:2px 9px;border-radius:99px;background:var(--ac2);color:var(--ac);white-space:nowrap;font-weight:600}
.pill.y{background:var(--yolk2);color:var(--yolk)}
.pill.r{background:var(--bad2);color:var(--bad)}
.pill.b{background:#e7f0fa;color:var(--blue)}
.bar{height:8px;background:var(--line);border-radius:6px;overflow:hidden;margin:6px 0 2px}
.bar i{display:block;height:100%;background:var(--ac);border-radius:6px}
.bar.y i{background:var(--yolk)}
.alert{display:flex;gap:10px;align-items:flex-start;background:var(--yolk2);border-radius:12px;padding:10px 12px;margin-bottom:8px}
.alert.r{background:var(--bad2)}
.alert i{font-style:normal;font-size:18px;line-height:1.3}
.alert b{font-size:14px}
.alert small{display:block;color:var(--mute);font-size:12px}
.chart{display:flex;align-items:flex-end;gap:6px;height:110px;padding-top:8px}
.chart div{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;height:100%;font-size:11px;color:var(--mute)}
.chart i{width:100%;background:linear-gradient(#f0b04a,#d98a12);border-radius:8px 8px 3px 3px;min-height:4px}
.chart div.t i{background:linear-gradient(#4ea86b,#2e7d4f)}
.btns{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:12px 0 4px}
.btns button{font:inherit;font-size:13px;font-weight:600;border:0;border-radius:12px;padding:10px 4px;background:var(--ac2);color:var(--ac)}
.btns button.o{background:var(--yolk2);color:var(--yolk)}
nav{position:fixed;left:0;right:0;bottom:0;background:#fff;box-shadow:0 -2px 12px rgba(0,0,0,.08);display:flex;overflow-x:auto;padding-bottom:env(safe-area-inset-bottom,0px);z-index:10}
nav button{flex:0 0 auto;min-width:66px;border:0;background:none;font:inherit;font-size:11px;color:var(--mute);padding:8px 6px;line-height:1.3}
nav button .ic{display:block;font-size:20px;line-height:1.2}
nav button.on{color:var(--ac);font-weight:700}
nav button.on .ic{transform:translateY(-2px)}
.empty{text-align:center;color:var(--mute);padding:16px}
.note{font-size:12px;color:var(--mute);margin:6px 4px}
</style>
</head>
<body>
<header>
  <div class="top">
    <img class="logo" src="logo-256.png" alt="" onerror="this.style.display='none'">
    <div><b>স্বদেশী এগ্রো</b><span id="dateTxt"></span></div>
  </div>
  <select id="batchSel" onchange="renderTab()">
    <option value="all">📊 সব ব্যাচ (মোট)</option>
    <option value="b1">ব্যাচ ১</option>
  </select>
</header>

<main id="app"></main>

<nav id="nav"></nav>

<script>
var KEY="khamar_v3", TAB="home";
var TABS=[["home","🏠","হোম"],["meat","🍗","মাংসের মুরগি"],["chick","🐥","বাচ্চা"],["egg","🥚","ডিম"],["feed","🌾","খাবার"],["med","💊","ওষুধ"],["money","💰","হিসাব"],["assets","🧺","এসেট"],["parent","🐓","প্যারেন্টস"]];

/* ---------- helpers ---------- */
function iso(d){var m=d.getMonth()+1,x=d.getDate();return d.getFullYear()+"-"+(m<10?"0":"")+m+"-"+(x<10?"0":"")+x}
function today(){return iso(new Date())}
function dt(s){var p=s.split("-");return new Date(+p[0],+p[1]-1,+p[2])}
function diff(a,b){return Math.round((dt(a)-dt(b))/864e5)}
function addD(s,n){var d=dt(s);d.setDate(d.getDate()+n);return iso(d)}
function bn(n){return Number(n||0).toLocaleString("bn-BD",{maximumFractionDigits:1})}
function tk(n){return "৳"+Math.round(n||0).toLocaleString("bn-BD")}
function fmt(s){return dt(s).toLocaleDateString("bn-BD",{day:"numeric",month:"short"})}
function sum(a,f){return a.reduce(function(t,x){return t+(+f(x)||0)},0)}

/* ---------- ডাটা: আগের khamar_v3 থাকলে সেখান থেকে, না থাকলে ডেমো ---------- */
var D={
 parents:[{t:"মুরগি",n:5,p:700},{t:"মুরগি",n:18,p:650},{t:"মুরগি",n:16,p:500},{t:"মোরগ",n:12,p:500}],
 batches:[{id:"b1",name:"ব্যাচ ১",hatch:addD(today(),-7),alive:137,dead:0,cost:1960}],
 chickDeath:[{d:addD(today(),-2),n:0}],
 eggs7:[18,22,20,25,24,21,23],
 eggsToday:23,
 seedStock:0,
 feedKg:42,feedDaily:3.2,feedPrice:52,
 meds:[{d:today(),name:"ভ্যাক্সিন (ND)",type:"ভ্যাক্সিন",done:false},{d:addD(today(),2),name:"থায়ামিন + বিটা থিল",type:"ওষুধ",done:false},{d:addD(today(),4),name:"অ্যামোক্সিসিলিন",type:"ওষুধ",done:false}],
 costs:[{c:"খাবার",a:350},{c:"ওষুধ",a:1830},{c:"সরঞ্জাম",a:180}],
 assets:[["২০০ ওয়াট বালব (৪×৬০)",240],["১০০ ওয়াট বালব (৪×৩০)",120],["হোল্ডার (২×৫০)",100],["২ পিন (২×৫০)",100],["ব্রুডিং টিন",900],["অটো তাপমাত্রা ব্রুডার লাইট",800],["পানির পাত্র (৮×৩০)",240],["খাবার পাত্র (২×৫০)",100],["পানি ও খাবারের স্ট্যান্ড (৫×৩০)",150]],
 loans:{give:0,get:4800,who:"সাগর"}
};

/* আগের ডাটা থেকে যা পাওয়া যায় সেটা বসানো */
try{
 var sv=JSON.parse(localStorage.getItem(KEY)||"null");
 if(sv){
  if(sv.flock&&sv.flock.length)D.parents=sv.flock.map(function(f){return{t:f.type,n:f.n,p:f.price}});
  if(sv.inc&&sv.inc.length)D.batches=sv.inc.map(function(x,i){return{id:"b"+(i+1),name:x.name||("ব্যাচ "+(i+1)),hatch:x.start,alive:x.hatched||0,dead:0,cost:0}});
  if(sv.med&&sv.med.length)D.meds=sv.med.filter(function(x){return !x.done}).map(function(x){return{d:x.date,name:x.name,type:x.type,done:false}});
  if(sv.eggs&&sv.eggs.length){var t=today(),arr=[];for(var i=6;i>=0;i--){var dd=addD(t,-i);arr.push(sum(sv.eggs.filter(function(x){return x.date===dd}),function(x){return x.table}))}D.eggs7=arr;D.eggsToday=arr[6]}
 }
}catch(e){}

/* ---------- হিসাব ---------- */
function parentVal(){return sum(D.parents,function(x){return x.n*x.p})}
function birds(){return sum(D.parents,function(x){return x.n})}
function meatBirds(){return sum(D.batches,function(x){return x.alive})}
function assetTotal(){return sum(D.assets,function(x){return x[1]})}
function costTotal(){return sum(D.costs,function(x){return x.a})}
function estSalePerBird(age){return age>=60?650:(age>=30?400:180)}
function feedLeft(){return D.feedKg}
function daysLeft(){return D.feedDaily?Math.floor(feedLeft()/D.feedDaily):0}
function eggTotal7(){return sum(D.eggs7,function(x){return x})}
function layRate(){return birds()?Math.round(D.eggsToday/birds()*100):0}

/* ---------- ড্যাশবোর্ড ---------- */
function home(){
 var t=today(),al="";
 var due=D.meds.filter(function(m){return diff(m.d,t)<=0&&!m.done});
 due.forEach(function(m){al+="<div class='alert "+(diff(m.d,t)<0?"r":"")+"'><i>💊</i><div><b>"+m.name+"</b><small>"+(diff(m.d,t)<0?bn(-diff(m.d,t))+" দিন দেরি":"আজ দিতে হবে")+"</small></div></div>"});
 if(daysLeft()<=5)al+="<div class='alert'><i>🌾</i><div><b>খাবার প্রায় শেষ</b><small>প্রায় "+bn(daysLeft())+" দিন চলবে, কিনে রাখুন</small></div></div>";
 D.batches.forEach(function(b){var age=diff(t,b.hatch);if(age>=60&&age<=70)al+="<div class='alert'><i>🍗</i><div><b>"+b.name+": বিক্রির সময় কাছে</b><small>বয়স "+bn(age)+" দিন</small></div></div>"});
 return ""+
 "<h2>আজকের অবস্থা <small>"+fmt(t)+"</small></h2>"+
 "<div class='grid'>"+
  kpi("hi",bn(D.eggsToday)+"টি","আজকের ডিম")+
  kpi("",bn(meatBirds())+"টি","মাংসের মুরগি (মজুদ)")+
  kpi("",bn(birds())+"টি","প্যারেন্ট (মুরগি/মোরগ)")+
  kpi(daysLeft()<=5?"warn":"",bn(feedLeft())+" কেজি","খাবার বাকি · "+bn(daysLeft())+" দিন")+
 "</div>"+
 "<h2>করণীয় ও সাজেশন</h2>"+(al||"<div class='empty'>আজ জরুরি কিছু নেই ✓</div>")+
 "<h2>গত ৭ দিনের ডিম <small>মোট "+bn(eggTotal7())+"টি</small></h2>"+eggChart()+
 "<h2>আর্থিক সার</h2><div class='grid'>"+
  kpi("",tk(parentVal()),"প্যারেন্টসের মূল্য")+
  kpi("",tk(assetTotal()),"মোট এসেট")+
  kpi("",tk(costTotal()),"মোট খরচ")+
  kpi("hi",tk(D.loans.get),"পাওনা ধার ("+D.loans.who+")")+
 "</div>";
}
function kpi(c,v,l){return "<div class='kpi "+c+"'><span>"+l+"</span><b>"+v+"</b></div>"}
function eggChart(){
 var mx=Math.max.apply(null,D.eggs7.concat([1])),days=["আজ"];
 var h="<div class='card'><div class='chart'>";
 D.eggs7.forEach(function(v,i){h+="<div class='"+(i===6?"t":"")+"'><i style='height:"+Math.max(6,v/mx*100)+"%'></i>"+bn(v)+"</div>"});
 return h+"</div><div class='note'>ডিম ডিম উৎপাদনের ডাটা। হার: "+bn(layRate())+"% (প্যারেন্টস অনুযায়ী)</div></div>";
}

/* ---------- মাংসের মুরগি ---------- */
function meat(){
 var t=today(),h="<h2>মাংসের মুরগি <small>বাচ্চা থেকে ২–৬ মাস</small></h2>";
 D.batches.forEach(function(b){
  var age=diff(t,b.hatch),pct=Math.min(100,age/180*100),sale=estSalePerBird(age),val=b.alive*sale;
  h+="<div class='card'><div class='row'><div><b>"+b.name+"</b><small>বয়স "+bn(age)+" দিন · "+fmt(b.hatch)+" এ ফোটা</small></div><span class='pill "+(age>=60?"y":"b")+"'>"+(age>=60?"বিক্রির সময়":"বড় হচ্ছে")+"</span></div>"+
   "<div class='bar'><i style='width:"+pct+"%'></i></div><small class='note'>বাচ্চা → ২ মাস → ৫/৬ মাস</small>"+
   "<div class='row'><div>জীবিত<small>মৃত: "+bn(b.dead)+"</small></div><b>"+bn(b.alive)+"টি</b></div>"+
   "<div class='row'><div>আনুমানিক বিক্রি মূল্য<small>প্রতি মুরগি ~"+tk(sale)+"</small></div><b>"+tk(val)+"</b></div></div>";
 });
 return h;
}

/* ---------- বাচ্চা ---------- */
function chick(){
 var h="<h2>বাচ্চা হিসাব <small>খরচ + মৃত্যু</small></h2>";
 D.batches.forEach(function(b){
  var cpb=b.alive?b.cost/b.alive:0;
  h+="<div class='card'><div class='row'><b>"+b.name+"</b><span class='pill'>"+bn(b.alive)+" জীবিত</span></div>"+
   "<div class='row'><div>মোট বাচ্চা খরচ<small>খাবার, ওষুধ, ভ্যাক্সিন, সরঞ্জাম</small></div><b>"+tk(b.cost)+"</b></div>"+
   "<div class='row'><div>প্রতি বাচ্চা খরচ</div><b>"+tk(cpb)+"</b></div>"+
   "<div class='row'><div>মৃত্যু</div><span class='pill r'>"+bn(b.dead)+"টি</span></div></div>";
 });
 return h+"<div class='btns'><button>+ খরচ</button><button>+ মৃত্যু</button><button class='o'>+ ব্যাচ</button></div>";
}

/* ---------- ডিম ---------- */
function egg(){
 return "<h2>ডিম উৎপাদন <small>বিশ্লেষণ</small></h2>"+eggChart()+
 "<div class='card'><div class='row'><div>আজকের ডিম<small>গত ৭ দিনের গড় "+bn(Math.round(eggTotal7()/7))+"টি</small></div><b>"+bn(D.eggsToday)+"টি</b></div>"+
 "<div class='row'><div>ডিম পাড়ার হার<small>প্যারেন্টস অনুযায়ী</small></div><b>"+bn(layRate())+"%</b></div>"+
 "<div class='row'><div>বীজ ডিম মজুদ</div><b>"+bn(D.seedStock)+"টি</b></div></div>"+
 "<div class='btns'><button>+ ডিম</button><button>+ বিক্রি</button><button class='o'>+ নষ্ট</button></div>";
}

/* ---------- খাবার ---------- */
function feed(){
 return "<h2>খাবার হিসাব</h2><div class='grid'>"+kpi("",bn(feedLeft())+" কেজি","বাকি খাবার")+kpi(daysLeft()<=5?"warn":"",bn(daysLeft())+" দিন","চলবে")+kpi("",bn(D.feedDaily)+" কেজি","প্রতিদিন ব্যবহার")+kpi("",tk(D.feedKg*D.feedPrice),"মজুদ মূল্য")+"</div>"+
 "<div class='card'><div class='bar "+(daysLeft()<=5?"y":"")+"'><i style='width:"+Math.min(100,daysLeft()/30*100)+"%'></i></div><small class='note'>৩০ দিনের হিসাবে বাকি আছে</small></div>"+
 "<div class='btns'><button>+ খাবার কেনা</button><button>+ ব্যবহার</button><button class='o'>দাম বদল</button></div>";
}

/* ---------- ওষুধ ও ভ্যাক্সিন (তারিখ অনুযায়ী সাজানো) ---------- */
function med(){
 var t=today(),list=D.meds.slice().sort(function(a,b){return a.d<b.d?-1:1}),h="<h2>ওষুধ ও ভ্যাক্সিন <small>কখন, কোন ব্যাচে</small></h2><div class='card'>";
 if(!list.length)h+="<div class='empty'>কোনো ওষুধ বাকি নেই</div>";
 list.forEach(function(m){var d=diff(m.d,t),p=d<0?"<span class='pill r'>"+bn(-d)+" দিন দেরি</span>":d===0?"<span class='pill y'>আজ</span>":"<span class='pill b'>"+fmt(m.d)+"</span>";
  h+="<div class='row'><div>"+m.name+"<small>"+m.type+" · সব ব্যাচ</small></div>"+p+"</div>"});
 return h+"</div>";
}

/* ---------- হিসাব (মোট) ---------- */
function money(){
 var inv=parentVal()+assetTotal()+costTotal(),h="<h2>মোট হিসাব</h2><div class='grid'>"+kpi("",tk(inv),"মোট ইনভেস্ট")+kpi("",tk(assetTotal()),"এসেট (এককালীন)")+kpi("",tk(parentVal()),"প্যারেন্টস মূল্য")+kpi("",tk(costTotal()),"মোট খরচ")+"</div>";
 h+="<h2>খরচের ভাগ</h2><div class='card'>";
 D.costs.forEach(function(c){h+="<div class='row'><div>"+c.c+"</div><b>"+tk(c.a)+"</b></div>"});
 h+="</div><h2>ধার</h2><div class='card'><div class='row'><div>"+D.loans.who+" থেকে পাওনা</div><span class='pill'>"+tk(D.loans.get)+"</span></div></div>";
 return h;
}

/* ---------- এসেট ---------- */
function assets(){
 var h="<h2>এসেট <small>এককালীন ভালো আছে এমন জিনিস</small></h2><div class='card'>";
 D.assets.forEach(function(a){h+="<div class='row'><div>"+a[0]+"</div><b>"+tk(a[1])+"</b></div>"});
 return h+"<div class='row'><b>মোট এসেট</b><b>"+tk(assetTotal())+"</b></div></div>";
}

/* ---------- প্যারেন্টস ---------- */
function parent(){
 var h="<h2>প্যারেন্টস <small>মোট "+bn(birds())+"টি</small></h2><div class='card'>";
 D.parents.forEach(function(p){h+="<div class='row'><div>"+p.t+"<small>"+bn(p.n)+"টি × "+tk(p.p)+"</small></div><b>"+tk(p.n*p.p)+"</b></div>"});
 return h+"<div class='row'><b>মোট মূল্য</b><b>"+tk(parentVal())+"</b></div></div>";
}

var R={home:home,meat:meat,chick:chick,egg:egg,feed:feed,med:med,money:money,assets:assets,parent:parent};

function renderNav(){
 document.getElementById("nav").innerHTML=TABS.map(function(x){return "<button class='"+(x[0]===TAB?"on":"")+"' onclick=\"go('"+x[0]+"')\"><span class='ic'>"+x[1]+"</span>"+x[2]+"</button>"}).join("");
}
